# Sorts the pull requests a release lists into sections by label. GitHub reads this when
# the release workflow creates a draft with --generate-notes. A pull request goes in the
# first section whose labels it carries; one with none of them goes under Other changes.
changelog:
  exclude:
    labels:
      - duplicate
      - invalid
      - wontfix
  categories:
    - title: Features
      labels:
        - enhancement
    - title: Fixes
      labels:
        - bug
    - title: Documentation
      labels:
        - documentation
    - title: Other changes
      labels:
        - "*"
